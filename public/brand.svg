<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">White Dreams Automator logo</title>
  <desc id="desc">A luminous silver crescent surrounding a cloud, automation gear, circuit paths, stars, and a WD monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2938"/><stop offset=".55" stop-color="#0c1624"/><stop offset="1" stop-color="#172538"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef7ff" stop-opacity=".62"/><stop offset=".16" stop-color="#7590ad" stop-opacity=".2"/><stop offset=".78" stop-color="#152132" stop-opacity=".08"/><stop offset="1" stop-color="#a9c4df" stop-opacity=".4"/></linearGradient>
    <linearGradient id="silver" x1=".15" y1=".05" x2=".82" y2=".93"><stop stop-color="#fff"/><stop offset=".35" stop-color="#e8eef6"/><stop offset=".67" stop-color="#aebdd0"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#91abc7"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#dfe8f4"/><stop offset="1" stop-color="#899bb1"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".35" stop-color="#d7edff"/><stop offset=".7" stop-color="#70baff"/><stop offset="1" stop-color="#2d6eaf"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000b18" flood-opacity=".8"/></filter>
    <mask id="crescent"><rect width="1254" height="1254" fill="black"/><circle cx="616" cy="579" r="446" fill="white"/><circle cx="747" cy="482" r="384" fill="black"/></mask>
  </defs>

  <rect width="1254" height="1254" fill="#0b121c"/>
  <rect x="74" y="64" width="1106" height="1084" rx="210" fill="#7dc2ff" opacity=".32" filter="url(#glow)"/>
  <rect x="77" y="67" width="1100" height="1078" rx="207" fill="url(#bg)" stroke="#eff8ff" stroke-width="10"/>
  <rect x="91" y="81" width="1072" height="1050" rx="192" fill="url(#glass)" stroke="#99b9d8" stroke-width="4"/>
